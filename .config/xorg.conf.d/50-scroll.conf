Section "InputClass"
    Identifier "touchpad natural scrolling"
    MatchIsTouchpad "on"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "NaturalScrolling" "true"
    Option "Tapping" "on"
EndSection

# Logitech K400 Plus pad presents as pointer, not touchpad, so the
# section above never matches it - needs MatchProduct. Real mice stay
# default (traditional): do not add a MatchIsPointer section.
Section "InputClass"
    Identifier "k400 natural scrolling"
    MatchProduct "K400"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "NaturalScrolling" "true"
    Option "Tapping" "on"
EndSection

# K400 scroll goes via keyd virtual pointer (keyd grabs with [ids] *),
# so natural must also be set there - toggling K400 alone has no effect.
Section "InputClass"
    Identifier "keyd virtual pointer natural scrolling"
    MatchProduct "keyd virtual pointer"
    MatchDevicePath "/dev/input/event*"
    Driver "libinput"
    Option "NaturalScrolling" "true"
EndSection
